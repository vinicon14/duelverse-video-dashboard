<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelverse Video Dashboard — Auto-Update</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=JetBrains+Mono:wght@400;700&display=swap');
  :root { --bg:#0D0D1A; --gold:#FFD700; --blue:#00BFFF; --red:#FF4444; --card:#151528; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'JetBrains Mono',monospace; background:var(--bg); color:#EAEAEA; min-height:100vh; padding:2rem 1rem; }
  header { text-align:center; margin-bottom:2rem; }
  h1 { font-family:'Orbitron',sans-serif; font-size:2.2rem; color:var(--gold); letter-spacing:2px; text-shadow:0 0 20px rgba(255,215,0,0.3); }
  .subtitle { color:var(--blue); font-size:0.95rem; margin-top:0.3rem; }
  .refresh-btn { display:inline-block; background:var(--gold); color:#0D0D1A; border:none; padding:0.6rem 1.2rem; font-family:inherit; font-weight:700; border-radius:6px; cursor:pointer; margin-top:0.8rem; }
  .refresh-btn:hover { background:#FFE066; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:2px solid var(--blue); border-radius:12px; overflow:hidden; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-4px); border-color:var(--gold); }
  .card video { width:100%; height:220px; object-fit:cover; background:#000; display:block; }
  .card-body { padding:1rem; }
  .card-body h3 { color:var(--gold); font-family:'Orbitron',sans-serif; font-size:1.05rem; margin-bottom:0.25rem; }
  .meta { color:#888; font-size:0.8rem; }
  .badge { display:inline-block; padding:0.15rem 0.5rem; border-radius:4px; font-size:0.75rem; margin-top:0.4rem; }
  .badge-pro { background:var(--blue); color:#0D0D1A; }
  .badge-music { background:var(--red); color:#fff; }
  .badge-intercalado { background:var(--gold); color:#0D0D1A; }
  .status { text-align:center; color:#888; font-size:0.85rem; margin-top:1rem; min-height:1.2rem; }
  .error { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>DUELVERSE VIDEO DASHBOARD</h1>
  <div class="subtitle">Atualiza automaticamente do repositório • Clique para refresh</div>
  <button class="refresh-btn" onclick="loadVideos()">🔄 Atualizar agora</button>
</header>

<div id="status" class="status">Carregando vídeos do GitHub...</div>
<div id="grid" class="grid"></div>

<script>
// Config: repo + pasta
const REPO = "vinicon14/duelverse-video-dashboard";
const FOLDER = "videos";

// Lista manual de arquivos conhecidos (garante exibição mesmo com CORS parcial)
// O fetch da API GitHub para conteúdo público funciona sem token para listagem básica
const KNOWN_FILES = [
  {file:"duelverse_chain_pro_final_with_music.mp4", title:"Chain Resolution PRO (com voz + música)", tag:"pro", extra:"3m38s • 1080p60"},
  {file:"duelverse_priority_pro_final_with_music.mp4", title:"Priority & Spell Speed PRO", tag:"pro", extra:"2m32s • 1080p60"},
  {file:"duelverse_timing_pro_final_with_music.mp4", title:"Missing the Timing PRO", tag:"pro", extra:"2m23s • 1080p60"},
  {file:"duell_today_final_fixed.mp4", title:"Duelverse de Hoje — Manim + bg", tag:"music", extra:"~19s • animação sequencial"},
  {file:"duelverse_intercalado_final_fixed.mp4", title:"Intercalado (Chain + Priority + Timing)", tag:"intercalado", extra:"~5s • sem overlap"},
];

function buildUrl(file) {
  return `https://raw.githubusercontent.com/${REPO}/main/${FOLDER}/${file}`;
}

function renderCard(fileInfo) {
  const url = buildUrl(fileInfo.file);
  const badgeClass = fileInfo.tag === "pro" ? "badge-pro" : fileInfo.tag === "music" ? "badge-music" : "badge-intercalado";
  const badgeText = fileInfo.tag === "pro" ? "PRO" : fileInfo.tag === "music" ? "HOJE" : "INTERCALADO";
  return `
    <div class="card">
      <video src="${url}" controls poster="${url}" preload="metadata"></video>
      <div class="card-body">
        <h3>${fileInfo.title}</h3>
        <div class="meta">${fileInfo.extra} • ${fileInfo.file}</div>
        <div><span class="badge ${badgeClass}">${badgeText}</span></div>
        <div style="margin-top:0.4rem; font-size:0.75rem; color:#aaa;">Raw: <a href="${url}" style="color:var(--blue); word-break:break-all;">github.io/...</a></div>
      </div>
    </div>`;
}

async function loadVideos() {
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  grid.innerHTML = "";
  status.textContent = "Buscando na API do GitHub...";
  status.className = "status";

  try {
    // Tenta listar via API pública (sem auth permite lista básica de conteúdo público)
    const apiUrl = `https://api.github.com/repos/${REPO}/contents/${FOLDER}`;
    const resp = await fetch(apiUrl, {method:"GET"});
    let apiFiles = [];
    if (resp.ok) {
      const data = await resp.json();
      apiFiles = Array.isArray(data) ? data.filter(x => x.name && x.name.endsWith(".mp4")) : [];
    }

    // Mescla com conhecidos (garante que apareçam mesmo se API falhar)
    const merged = new Map();
    for (const k of KNOWN_FILES) merged.set(k.file, k);
    for (const f of apiFiles) {
      if (!merged.has(f.name)) {
        merged.set(f.name, {file:f.name, title:f.name, tag:"novo", extra:f.size?Math.round(f.size/1024/1024)+"MB":"?"});
      }
    }

    if (merged.size === 0) {
      status.textContent = "Nenhum vídeo encontrado. Verifique o repo.";
      return;
    }

    status.textContent = `Encontrados ${merged.size} vídeos • Atualizado agora`;
    for (const item of merged.values()) {
      grid.insertAdjacentHTML("beforeend", renderCard(item));
    }
  } catch (e) {
    status.textContent = "Erro ao carregar: " + e.message;
    status.className = "status error";
    // Fallback: render connus
    grid.innerHTML = KNOWN_FILES.map(renderCard).join("");
    status.textContent = "Carregado com fallback (lista local) • API falhou";
  }
}

// Auto-load
loadVideos();
</script>
</body>
</html>
